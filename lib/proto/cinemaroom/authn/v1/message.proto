syntax = "proto3";

package cinemaroom.authn.v1.message;

option php_namespace = "GRPC\\Services\\Authn\\v1";
option php_metadata_namespace = "GRPC\\ProtobufMetadata\\Authn\\v1";

import "google/protobuf/timestamp.proto";

message Tokens {
  JwtToken jwt_token = 1;
  RefreshToken refresh_token = 2;
}

message JwtToken {
  string value = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RefreshToken {
  string value = 1;
  google.protobuf.Timestamp expires_at = 2;
}