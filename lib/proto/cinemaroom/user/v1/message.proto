syntax = "proto3";

package cinemaroom.user.v1.message;

option php_namespace = "GRPC\\Services\\Users\\v1";
option php_metadata_namespace = "GRPC\\ProtobufMetadata\\Users\\v1";

import "cinemaroom/common/v1/message.proto";

message User {
  common.v1.message.Uuid id = 1;
  string username = 2;
  optional Avatar avatar = 3;
  string bio = 4;
}

message Avatar {
  string path = 1;
}