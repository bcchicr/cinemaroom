name: ci.yml

on:
  push:
  pull_request:
    branches: [ develop, main ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      authn-changed: ${{ steps.filter.outputs.authn }}
      chat-changed: ${{ steps.filter.outputs.chat }}
      chat-authz-changed: ${{ steps.filter.outputs.chat-authz }}
      gateway-changed: ${{ steps.filter.outputs.gateway }}
      playlist-changed: ${{ steps.filter.outputs.playlist }}
      user-changed: ${{ steps.filter.outputs.user }}
      proto-changed: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            authn: 'services/authn/**'
            chat: 'services/chat/**'
            chat-authz: 'services/chat-authz/**'
            gateway: 'services/gateway/**'
            playlist: 'services/playlist/**'
            user: 'services/user/**'
            proto: 'lib/proto/**'

  test-user:
    needs: detect-changes
    if: needs.detect-changes.outputs.user-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Copy envs
        run: |
          cp .env.example .env
          echo "" >> .env
          echo "COMPOSE_FILE=compose.test.yml" >> .env

      - name: Build images
        run: |
          make init-postgres
          make init-user

      - name: Run images
        run: |
          make up-postgres
          make up-user

      - name: Generate protobuf classes
        run: make protoc-user

      - name: Run static analysis
        run: make stat-check-user

      - name: Run migrations
        run: make migrate-user

      - name: Run tests
        run: make test-user

      - name: Run formatter
        run: make fmt-user

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(user): apply formatting'
          file_pattern: 'services/user/**/*.php'


  test-all:
    runs-on: ubuntu-latest
    needs: [ detect-changes, test-user ]
    steps:
      - run: echo "All selective tests completed successfully or skipped"