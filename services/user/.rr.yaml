version: "3"

server:
  command: "php public/index.php"
  env:
    - APP_RUNTIME: Baldinof\RoadRunnerBundle\Runtime\Runtime

grpc:
  listen: "tcp://0.0.0.0:9001"
  proto:
    - "/lib/proto/cinemaroom/user/v1/service.proto"

logs:
  mode: production
  channels:
    http:
      level: debug
    server:
      level: info
      mode: raw
    metrics:
      level: error

rpc:
  listen: tcp://127.0.0.1:6001
